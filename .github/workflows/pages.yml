name: 发布网页版

# 把 android/app/src/main/assets/index.html 发布到 GitHub Pages，
# 手机和电脑用浏览器直接打开即可，不需要安装任何程序。
on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/assets/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备站点目录
        run: |
          mkdir -p _site
          cp android/app/src/main/assets/index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
